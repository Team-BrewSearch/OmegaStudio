name: .NET Core Desktop
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x86
            self-contained: 'false'
          - os: windows-latest
            rid: win-x64
            self-contained: 'false'
          - os: ubuntu-latest
            rid: linux-x64
            self-contained: 'true'
          - os: ubuntu-latest
            rid: linux-arm64
            self-contained: 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    - name: Restore dependencies
      run: dotnet restore src/OmegaStudio.slnx --locked-mode
    - name: Build solution so the plugins exist
      run: dotnet build src/OmegaStudio.slnx --configuration Release --no-restore --nologo --verbosity minimal
    - name: Publish
      run: dotnet publish src/OmegaStudio/OmegaStudio.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained ${{ matrix.self-contained }} -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true ${{ matrix.self-contained == 'true' && '-p:EnableCompressionInSingleFile=true' || '' }} --output src/publish/${{ matrix.rid }} --nologo --verbosity minimal
    - name: Verify every plugin ships and pin them
      shell: bash
      run: |
        out=src/publish/${{ matrix.rid }}
        expected="DWSSK Generic Harugeki Nintendo PlayStation Polarbit Virtuos Xbox"
        list="$out/trusted-plugins.txt"
        : > "$list"
        for name in $expected; do
          dll="$out/formats/$name.Formats.dll"
          if [ ! -f "$dll" ]; then
            echo "::error::Published ${{ matrix.rid }} is missing $name.Formats.dll."
            exit 1
          fi
          echo "$name.Formats.dll sha256:$(sha256sum "$dll" | cut -d' ' -f1)" >> "$list"
        done
        for dll in "$out"/formats/*.Formats.dll; do
          base=$(basename "$dll" .Formats.dll)
          if ! grep -qw "$base" <<< "$expected"; then
            echo "::error::$base.Formats.dll is shipped but not pinned."
            exit 1
          fi
        done
        if grep -aq "omega/deps/SixLabors.ImageSharp" "$out/formats/Nintendo.Formats.dll" || ls "$out" | grep -qi imagesharp; then
          echo "::error::ImageSharp is in the published payload, so its advisory suppressions no longer hold."
          exit 1
        fi
        echo "Published ${{ matrix.rid }} with $(wc -l < "$list") pinned plugins."
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OmegaStudio-${{ matrix.rid }}
        path: src/publish/${{ matrix.rid }}/
